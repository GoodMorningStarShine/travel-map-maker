<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Map Maker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel" aria-label="Map controls">
        <div class="brand">
          <p class="eyebrow">Trip Planner</p>
          <h1>Route Map</h1>
        </div>

        <section class="control-group">
          <label for="place-name">Destination name</label>
          <input id="place-name" type="text" placeholder="Hotel, museum, beach...">
          <p class="hint">Click the map to add a destination. You can add up to 12 stops.</p>
        </section>

        <section class="toolbar" aria-label="Map actions">
          <button id="export-map" type="button">Export</button>
          <label class="file-button" for="import-map">Import</label>
          <input id="import-map" type="file" accept="application/json">
          <button id="clear-map" type="button" class="danger">Clear</button>
        </section>

        <section class="places-section">
          <div class="section-heading">
            <h2>Destinations</h2>
            <span id="place-count">0/12</span>
          </div>
          <ol id="places-list" class="destinations-list"></ol>
        </section>
      </aside>

      <section class="map-stage" aria-label="Interactive travel map">
        <div id="map"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js" type="module"></script>
    <script type="module">
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        const source = new EventSource("/__reload");
        source.addEventListener("reload", () => location.reload());
      }
    </script>
  </body>
</html>
